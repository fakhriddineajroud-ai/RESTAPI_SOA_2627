<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Atelier 6 - Client REST JWT</title>

    <script language="javascript">
        var API = window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/')) + "/rest";
        var accessToken = null, refreshToken = null;   // jetons JWT

        function newRequest() { return new XMLHttpRequest(); }   // un XHR par requête

        // ===== Étape 1 : authentification =====
        function login() {
            var username = document.getElementById("username").value;
            var password = document.getElementById("password").value;

            var xmlhttp = newRequest();
            xmlhttp.open('POST', API + "/authentication", true);
            xmlhttp.setRequestHeader('Content-Type', 'application/json');
            xmlhttp.onreadystatechange = function() {
                if (xmlhttp.readyState == 4 && xmlhttp.status == 200) {
                    var tokens = JSON.parse(xmlhttp.responseText);
                    accessToken  = tokens.accessToken;    // valide 15 min
                    refreshToken = tokens.refreshToken;   // valide 7 jours
                    alert("Connecté !");
                } else if (xmlhttp.readyState == 4) {
                    alert("Login failed: " + xmlhttp.status);
                }
            };
            xmlhttp.send(JSON.stringify({ username: username, password: password }));
        }

        // ===== Étape 2 : appel du service sécurisé =====
        function getOptions(retried) {
            var domaine = document.getElementById("domaine");

            var xmlhttp = newRequest();
            var url = API + "/options?domaine=" + encodeURIComponent(domaine.value);
            xmlhttp.open('GET', url, true);
            xmlhttp.setRequestHeader('Authorization', 'Bearer ' + accessToken);

            // ===== Étape 3 : traitement de la réponse =====
            xmlhttp.onreadystatechange = function() {
                var code        = document.getElementById("code");
                var libelle     = document.getElementById("libelle");
                var responsable = document.getElementById("responsable");

                if (xmlhttp.readyState == 4) {
                    if (xmlhttp.status == 200) {
                        code.value = ""; libelle.value = ""; responsable.value = "";
                        var resultat = JSON.parse(xmlhttp.responseText);
                        for (var i in resultat) {
                            code.value        += " " + resultat[i].codeOption;
                            libelle.value     += " " + resultat[i].libelle;
                            responsable.value += " " + resultat[i].responsable;
                        }
                    } else if (xmlhttp.status == 401) {
                        if (retried) alert("Session expired: please log in again");
                        else refreshAndRetry();
                    } else if (xmlhttp.status == 404) {
                        alert("Aucune option pour ce domaine");
                    } else alert("Error -> " + xmlhttp.status);
                }
            };
            xmlhttp.send(null);
        }

        // ===== Étape 4 : jeton expiré -> rafraîchir et réessayer =====
        function refreshAndRetry() {
            var xmlhttp = newRequest();
            xmlhttp.open('POST', API + "/authentication/refresh", true);
            xmlhttp.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
            xmlhttp.onreadystatechange = function() {
                if (xmlhttp.readyState == 4) {
                    if (xmlhttp.status == 200) {
                        var tokens = JSON.parse(xmlhttp.responseText);
                        accessToken  = tokens.accessToken;
                        refreshToken = tokens.refreshToken;   // rotation : toujours remplacer
                        getOptions(true);                     // réessayer une seule fois
                    } else alert("Session expired: please log in again");
                }
            };
            xmlhttp.send("refreshToken=" + encodeURIComponent(refreshToken));
        }
    </script>
</head>

<body>
<h2>Tester le service Options</h2>

Utilisateur : <input type="text" id="username" value="admin">
Mot de passe : <input type="password" id="password" value="admin">
<input type="button" value="Se connecter" onclick="login()">
<br><br>

Saisir le domaine : <input type="text" id="domaine" value="Informatique">
<input type="button" value="OK" onclick="getOptions(false)">
<br><br>

Code : <input type="text" id="code"><br>
Titre : <input type="text" id="libelle"><br>
Responsable : <input type="text" id="responsable">
</body>
</html>
